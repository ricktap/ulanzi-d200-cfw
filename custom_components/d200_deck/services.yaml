notify:
  fields:
    message:
      required: true
      example: "Washing machine done"
      selector:
        text:
    title:
      example: "Laundry"
      selector:
        text:
    icon:
      example: "notification"
      selector:
        text:
    color:
      example: "#FFBF69"
      selector:
        text:
    duration:
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
    critical:
      default: false
      selector:
        boolean:
    base_topic:
      advanced: true
      selector:
        text:

set_key:
  fields:
    key_id:
      required: true
      example: "doorbell"
      selector:
        text:
    label:
      example: "Door"
      selector:
        text:
    kind:
      example: "presence"
      selector:
        select:
          options: [light, switch, sensor, climate, lock, unlock, cover, scene, vacuum, automation, presence, energy]
    icon:
      example: "bell"
      selector:
        text:
    value:
      example: "open"
      selector:
        text:
    "on":
      selector:
        boolean:
    color:
      example: "#69E0C1"
      selector:
        text:
    progress:
      selector:
        number:
          min: 0
          max: 100
    background:
      example: "#1F2937"
      selector:
        text:
    base_topic:
      advanced: true
      selector:
        text:

clear_key:
  fields:
    key_id:
      required: true
      example: "doorbell"
      selector:
        text:
    base_topic:
      advanced: true
      selector:
        text:

show_remote_page:
  fields:
    show:
      default: true
      selector:
        boolean:
    base_topic:
      advanced: true
      selector:
        text:

press_key:
  fields:
    key:
      required: true
      example: 4
      selector:
        number:
          min: 0
          max: 13
    event:
      default: press
      selector:
        select:
          options: [press, long_press, double_press]
    base_topic:
      advanced: true
      selector:
        text:

run_action:
  fields:
    action:
      required: true
      example: "core:page"
      selector:
        text:
    params:
      example: '{"page": "Media"}'
      selector:
        object:
    base_topic:
      advanced: true
      selector:
        text:

configure_key:
  fields:
    key:
      required: true
      example: 4
      selector:
        number:
          min: 0
          max: 12
    profile:
      example: "Default"
      selector:
        text:
    page:
      example: "Home"
      selector:
        text:
    label:
      example: "Lamp"
      selector:
        text:
    icon:
      example: "core:light"
      selector:
        text:
    color:
      example: "#1F2937"
      selector:
        text:
    text_color:
      example: "#FFFFFF"
      selector:
        text:
    base_topic:
      advanced: true
      selector:
        text:

remove_key:
  fields:
    key:
      required: true
      example: 4
      selector:
        number:
          min: 0
          max: 12
    profile:
      example: "Default"
      selector:
        text:
    page:
      example: "Home"
      selector:
        text:
    base_topic:
      advanced: true
      selector:
        text:

get_layout:
  fields:
    base_topic:
      advanced: true
      selector:
        text:

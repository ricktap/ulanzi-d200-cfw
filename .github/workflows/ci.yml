# Tests, builds and (for semver tags) releases.
#
#   push / pull request -> unit tests, e2e tests, device build, macOS app build
#   tag vX.Y.Z[-pre]    -> the same, then a GitHub release with the DMG and d200fw
#
# Release, either way:
#   git tag v1.2.3 && git push origin v1.2.3
#   Actions → CI → Run workflow, "release" = 1.2.3  (creates tag v1.2.3 on that commit)
# The version is taken from the tag or the input (scripts/set-version.sh), so the files in
# the repo don't have to be bumped first. A pre-release part (1.2.3-rc.1) makes a pre-release.
name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release this commit as version X.Y.Z (creates tag vX.Y.Z). Empty: just build."
        required: false
        default: ""

# A new push to a branch cancels that branch's older run; releases (tags, or runs
# started with a release version) are never cancelled and do not cancel others.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The release tag: the pushed tag, or v<input> for a release started by hand.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release != '' && format('v{0}', inputs.release) || '') }}

jobs:
  test:
    name: Tests (unit + e2e)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runners' Azure mirror (azure.archive.ubuntu.com) sometimes stops answering
      # and held releases for half an hour. Try it briefly, then use archive.ubuntu.com.
      - name: Linux packages for Tauri
        timeout-minutes: 15
        run: |
          PKGS="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev"
          OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          for i in 1 2 3; do
            if timeout 150 sudo apt-get update $OPTS && timeout 360 sudo apt-get install -y $OPTS $PKGS; then
              exit 0
            fi
            echo "::warning::apt failed (attempt $i), switching to archive.ubuntu.com"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] || continue
              sudo sed -i -E \
                -e 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' \
                -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$f"
            done
            sleep 5
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            device -> target
            app/src-tauri -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages for e2e
        run: pip install numpy pillow

      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: End-to-end tests
        env:
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          tests/e2e/run.sh

      - name: Upload e2e screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  device:
    name: Device binary (armv7)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device -> target

      - name: Build d200fw
        working-directory: device
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: d200fw
          path: device/target/armv7-unknown-linux-musleabihf/release/d200fw
          if-no-files-found: error

  app:
    name: Desktop app (macOS universal)
    timeout-minutes: 40
    needs: device
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The app embeds bin/d200fw; use the binary built from this commit.
      - uses: actions/download-artifact@v4
        with:
          name: d200fw
          path: bin

      - name: Version from the release tag
        if: env.RELEASE_TAG != ''
        run: scripts/set-version.sh "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # The updater package (.app.tar.gz + .sig) is signed with the key in the
      # TAURI_SIGNING_PRIVATE_KEY secret; without it the build skips that package.
      - name: Build
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without the updater package"
            npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # Not notarised: the app is signed ad hoc (tauri.conf.json, signingIdentity "-"),
      # so it runs on Apple Silicon. The .pkg installs it to /Applications and clears the
      # quarantine flag, so only the installer needs the Gatekeeper exception.
      - name: Installer (.pkg)
        run: |
          set -e
          BUNDLE=app/src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          codesign --verify --verbose "$BUNDLE/macos/D200 Deck.app"
          mkdir -p "$BUNDLE/pkg" stage
          cp -R "$BUNDLE/macos/D200 Deck.app" stage/
          # always install to /Applications, even if a copy exists elsewhere
          pkgbuild --analyze --root stage component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          pkgbuild --root stage --component-plist component.plist \
            --install-location /Applications \
            --scripts packaging/macos/scripts \
            --identifier dev.d200fw.deck \
            --version "$VERSION" \
            "$BUNDLE/pkg/D200 Deck_${VERSION}_universal.pkg"
          ls -l "$BUNDLE/dmg" "$BUNDLE/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: d200-deck-macos
          path: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/pkg/*.pkg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: GitHub release
    timeout-minutes: 40
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [test, device, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and history, for the changes since the last release

      # The release text: every commit since the previous release tag (title and body),
      # then how to install. Also the updater's notes in latest.json.
      - name: Release notes
        run: |
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname --merged HEAD | grep -vx "$RELEASE_TAG" | head -1 || true)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            git log --no-merges --reverse --format='### %s%n%n%b' "$RANGE" \
              | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:'
            echo
            echo "## Install"
            echo
            echo 'macOS (Intel and Apple Silicon, macOS 11+):'
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo 'An installed D200 Deck offers new releases itself (Update button in the header).'
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir out
          cp dist/d200-deck-macos/dmg/*.dmg dist/d200-deck-macos/pkg/*.pkg out/
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a semver tag: $RELEASE_TAG"; exit 1; }
          cp dist/d200fw/d200fw "out/d200fw-${RELEASE_TAG}-armv7"
          cp install.sh out/  # releases/latest/download/install.sh is always the newest
          # updater: the signed package and latest.json (the app reads it from releases/latest)
          VERSION="${RELEASE_TAG#v}"
          TAR=$(ls dist/d200-deck-macos/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -n "$TAR" ] && [ -f "$TAR.sig" ]; then
            NAME="D200-Deck_${VERSION}_universal.app.tar.gz"
            cp "$TAR" "out/$NAME"
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${NAME}"
            jq -n --arg v "$VERSION" --arg sig "$(cat "$TAR.sig")" --arg url "$URL" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --rawfile notes notes.md \
              '{version: $v, notes: $notes, pub_date: $date,
                platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' > out/latest.json
          else
            echo "::warning::no signed updater package: the release has no latest.json"
          fi
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: D200 Deck ${{ env.RELEASE_TAG }}
          files: out/*
          body_path: notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

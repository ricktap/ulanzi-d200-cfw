# Tests, builds and (for semver tags) releases.
#
#   push / pull request -> unit tests, e2e tests, device build, macOS app build
#   tag vX.Y.Z[-pre]    -> the same, then a GitHub release with the DMG and d200fw
#
# Release: git tag v1.2.3 && git push origin v1.2.3
# The version is taken from the tag (scripts/set-version.sh), so the files in the repo
# don't have to be bumped first. Tags with a pre-release part (v1.2.3-rc.1) become pre-releases.
name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            device -> target
            app/src-tauri -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages for e2e
        run: pip install numpy pillow

      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: End-to-end tests
        env:
          TMPDIR: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$TMPDIR"
          tests/e2e/run.sh

      - name: Upload e2e screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  device:
    name: Device binary (armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device -> target

      - name: Build d200fw
        working-directory: device
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: d200fw
          path: device/target/armv7-unknown-linux-musleabihf/release/d200fw
          if-no-files-found: error

  app:
    name: Desktop app (macOS universal)
    needs: device
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The app embeds bin/d200fw; use the binary built from this commit.
      - uses: actions/download-artifact@v4
        with:
          name: d200fw
          path: bin

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.sh "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npx tauri build --target universal-apple-darwin

      # Not notarised: the app is signed ad hoc (tauri.conf.json, signingIdentity "-"),
      # so it runs on Apple Silicon. The .pkg installs it to /Applications and clears the
      # quarantine flag, so only the installer needs the Gatekeeper exception.
      - name: Installer (.pkg)
        run: |
          set -e
          BUNDLE=app/src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          codesign --verify --verbose "$BUNDLE/macos/D200 Deck.app"
          mkdir -p "$BUNDLE/pkg" stage
          cp -R "$BUNDLE/macos/D200 Deck.app" stage/
          # always install to /Applications, even if a copy exists elsewhere
          pkgbuild --analyze --root stage component.plist
          plutil -replace 0.BundleIsRelocatable -bool NO component.plist
          pkgbuild --root stage --component-plist component.plist \
            --install-location /Applications \
            --scripts packaging/macos/scripts \
            --identifier dev.d200fw.deck \
            --version "$VERSION" \
            "$BUNDLE/pkg/D200 Deck_${VERSION}_universal.pkg"
          ls -l "$BUNDLE/dmg" "$BUNDLE/pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: d200-deck-macos
          path: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/pkg/*.pkg
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, device, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        run: |
          mkdir out
          cp dist/d200-deck-macos/dmg/*.dmg dist/d200-deck-macos/pkg/*.pkg out/
          cp dist/d200fw/d200fw "out/d200fw-${GITHUB_REF_NAME}-armv7"
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" role="img" aria-label="Plugins erzeugen Werte, Icons und Themes verbrauchen sie" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="760" height="544" fill="#FFFFFF"/><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A94A3"/></marker></defs><text x="24" y="34" font-size="15" fill="#17202B" font-weight="600">Plugins erzeugen Werte, Icons und Themes verbrauchen sie</text><g><rect x="24" y="56" width="300" height="120" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="38" y="80" font-size="13" fill="#17202B" font-weight="600">Plugin (mit Code)</text><text x="38" y="98" font-size="11.5" fill="#556170">Signale: Werte über die Zeit</text><text x="38" y="114" font-size="11.5" fill="#556170">Aktionen: was es tun kann</text><text x="38" y="130" font-size="11.5" fill="#556170">Interfaces und Apps</text><text x="38" y="146" font-size="11.5" fill="#556170">eingebettetes Icon Set</text></g><g><rect x="340" y="56" width="196" height="120" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="354" y="80" font-size="13" fill="#17202B" font-weight="600">Icon Set (nur Daten)</text><text x="354" y="98" font-size="11.5" fill="#556170">SVG plus Bindungen</text><text x="354" y="114" font-size="11.5" fill="#556170">nennt seine Rollen</text></g><g><rect x="552" y="56" width="184" height="120" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="566" y="80" font-size="13" fill="#17202B" font-weight="600">Theme (nur Daten)</text><text x="566" y="98" font-size="11.5" fill="#556170">Variablen, fest oder</text><text x="566" y="114" font-size="11.5" fill="#556170">an Signale gebunden</text><text x="566" y="130" font-size="11.5" fill="#556170">voll oder partial</text></g><g><rect x="24" y="216" width="712" height="200" rx="8" fill="#EEF1F4" stroke="#8A94A3" stroke-width="1"/><text x="38" y="240" font-size="13" fill="#17202B" font-weight="600">Kern</text></g><g><rect x="40" y="250" width="200" height="116" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="54" y="274" font-size="13" fill="#17202B" font-weight="600">Signalbus</text><text x="54" y="292" font-size="11.5" fill="#556170">sammelt alle Werte</text></g><g><rect x="256" y="250" width="200" height="116" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="270" y="274" font-size="13" fill="#17202B" font-weight="600">Engine</text><text x="270" y="292" font-size="11.5" fill="#556170">Taste gedrückt:</text><text x="270" y="308" font-size="11.5" fill="#556170">sucht Aktionen der Taste</text></g><g><rect x="472" y="250" width="248" height="116" rx="8" fill="#2456D6" fill-opacity="0.12" stroke="#2456D6" stroke-width="2"/><text x="486" y="274" font-size="13" fill="#17202B" font-weight="600">Renderer</text><text x="486" y="292" font-size="11.5" fill="#17202B">löst prop, bind und tone auf</text><text x="486" y="308" font-size="11.5" fill="#17202B">zeichnet jede Taste</text></g><path d="M100 178V248" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)"/><text x="108" y="204" font-size="11.5" fill="#556170">veröffentlicht Signale</text><path d="M300 248V178" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)"/><text x="308" y="204" font-size="11.5" fill="#556170">ruft Aktionen</text><path d="M500 178V248" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)"/><text x="508" y="204" font-size="11.5" fill="#556170">Icons</text><path d="M680 178V248" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)"/><text x="672" y="204" font-size="11.5" fill="#556170" text-anchor="end">Variablen</text><path d="M140 368V392H596V368" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)"/><text x="368" y="386" font-size="11.5" fill="#556170" text-anchor="middle">aktuelle Werte</text><g><rect x="24" y="456" width="340" height="64" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="38" y="480" font-size="13" fill="#17202B" font-weight="600">Konfigurator</text><text x="38" y="498" font-size="11.5" fill="#556170">wählt App, Icon und Theme, schreibt deck.json</text></g><g><rect x="472" y="456" width="264" height="64" rx="8" fill="none" stroke="#8A94A3" stroke-width="1.25"/><text x="486" y="480" font-size="13" fill="#17202B" font-weight="600">Ulanzi D200</text><text x="486" y="498" font-size="11.5" fill="#556170">zeigt Bilder, meldet Tasten</text></g><path d="M194 454V418" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)" marker-start="url(#dg-arrow)"/><text x="202" y="440" font-size="11.5" fill="#556170">Katalog, Vorschau</text><path d="M604 418V454" fill="none" stroke="#8A94A3" stroke-width="1.25" marker-end="url(#dg-arrow)" marker-start="url(#dg-arrow)"/><text x="612" y="440" font-size="11.5" fill="#556170">USB</text></svg>